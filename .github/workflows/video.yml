# O render do vídeo do Tem na Geladeira (video/), feito pelo Remotion no runner
# do GitHub (4 vCPU, 16 GB), para poupar o Mac de 8 GB. Roda só no ramo
# video-prova e à mão; não publica nada: o site sai do main, pelo Pages.
# Segurança (regra "CI endurecido" do padroes/PADRONIZACAO.md): o token só
# lê o repositório, as actions vão fixadas pelo SHA do commit (a versão no
# comentário), nenhuma credencial fica gravada no checkout, o job tem
# tempo-limite, e um envio novo cancela o anterior do mesmo ramo.
name: Vídeo do Tem na Geladeira

on:
  push:
    branches: [video-prova]
    paths:
      - 'video/**'
      - '.github/workflows/video.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render do mestre 9:16 (Remotion)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Instalar as dependências (versões do package-lock.json)
        run: npm ci

      - name: Conferir os tipos
        run: npm run typecheck

      - name: Baixar o Chrome Headless Shell do Remotion
        run: npx remotion browser ensure

      - name: Renderizar o mestre
        run: npm run render

      - name: Instalar o ffmpeg e o ffprobe (a imagem do runner não os traz)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Conferir o arquivo e tirar os quadros-chave
        run: npm run conferir

      - name: Guardar o MP4 e os quadros (também quando a checagem falha)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prova-2
          path: video/out/
          retention-days: 14
